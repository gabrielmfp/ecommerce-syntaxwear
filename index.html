<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntaxwear - Ecommerce</title>
    <meta name="description"
        content="Syntaxwear é a sua loja online de tênis e sneakers. Encontre os melhores modelos, promoções exclusivas e uma experiência de compra fácil e segura. Compre agora e eleve seu estilo com Syntaxwear!" />
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/viriables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/hero.css">
    <link rel="stylesheet" href="./css/product-category.css">
    <link rel="stylesheet" href="./css/product-grid.css">

</head>

<body>
    <header class="header">
        <h1 class="logo">
            <a href="/" title="Syntaxwear - Tênis e Sneakers online">
                <img src="./assets/images/logo/bag.svg" alt="Syntaxwear - Tênis e Sneakers online">
            </a>
        </h1>
        <nav class="nav-center" aria-label="Categorias Principais">
            <ul>
                <li><a href="">Masculino</a></li>
                <li><a href="">Feminino</a></li>
                <li><a href="">Outlet</a></li>
            </ul>
        </nav>
        <nav class="nav-right" aria-label="Menu Secundário">
            <ul>
                <li><a href="#">Nossas lojas</a></li>
                <li><a href="#">Sobre</a></li>
                <li>
                    <a href="#" aria-label="Minha conta">
                        <img src="./assets/images/logo/user.svg" alt="Minha conta">
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Ajuda">
                        <img src="./assets/images/logo/help.svg" alt="Ajuda">
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Carrinho">
                        <img src="./assets/images/logo/logo.svg" alt="Carrinho">
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <!-- Seção de destaque (Hero Section) -->
        <section class="hero-section">
            <div class="hero-overlay">>
                <div class="hero-content">
                    <span class="hero-subtitle">Krypton One</span>
                    <h2 class="hero-title">Transforme qualquer passo em presença.</h2>
                    <div class="hero-buttons">
                        <a class="btn btn-outline" href="#">Ver modelos</a>
                        <a class="btn btn-filled" href="#">Comprar</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Seção de Produtos em Destaque -->
        <section class="categories-section">
                <div class="category-card casual">
                    <a href="#" class="category-link">
                        <span class="overlay"></span>
                        <span class="category-name btn btn-outline">Casual</span>
                    </a>
                </div>
                <div class="category-card esporte">
                    <a href="#" class="category-link">
                        <span class="overlay"></span>
                        <span class="category-name btn btn-outline">Esporte</span>
                    </a>
                </div>
                <div class="category-card moderno">
                    <a href="#" class="category-link">
                        <span class="overlay"></span>
                        <span class="category-name btn btn-outline">Moderno</span>
                    </a>
                </div>
                <div class="category-card futurista">
                    <a href="#" class="category-link">
                        <span class="overlay"></span>
                        <span class="category-name btn btn-outline">Futurista</span>
                    </a>
                </div>
        </section>

        <!-- Seção de Categorias -->
        <section class="grid-section">
            <div class="card highlight">
                <div class="top1-content"><h3 class="card title">Krypton One</h3>
                <p class="card-subtitle">Estilo Urbano com atitude
                </p>
                 <div class="cta-group">
                    <a href="#" class="btn btn-outline">Feminino</a>
                    <a href="#" class="btn btn-outline">Masculino</a>
                 </div>
            </div>
            </div>
            <div class="card sneaker-purple"></div>
            <div class="card model"></div>
            <div class="card sneaker-color"></div>
            <div class="card sneaker-white"></div>
            <div class="card sneaker-silver"></div>
        </section>

        <!-- Seção de Promoções -->
        <section class="promotions">

        </section>

        <!-- Seção 'Sobre Nós' -->
        <section class="about-us">

        </section>
    </main>

    <footer>
        <!-- Seção do rodapé -->
    </footer>
</body>

</html>
